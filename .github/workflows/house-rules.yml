name: House rules

on:
  push:
    branches: [main]
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/house-rules.yml
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/house-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  house-rules:
    # Pinned with ci.yml; the rules it compares against still come from craft-contrib main, by design.
    uses: storytold/craft-common-actions/.github/workflows/house-rules.yml@3fe7aa009c15e57932497b5e6d00bf20f781e5ec
    with:
      rust: true
