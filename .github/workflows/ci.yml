name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Pinned so an upstream change cannot alter this repo's checks unseen (docs/designs/long-term-roadmap.md, step 2).
    # Moving the pin is its own PR. Pin: craft-common-actions main, 2026-11-27.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@3fe7aa009c15e57932497b5e6d00bf20f781e5ec
    with:
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
