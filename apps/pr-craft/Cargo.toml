[package]
name = "pr-craft"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "PR Craft desktop app"

[lints]
workspace = true

[dependencies]
pr-craft-ui-egui = { workspace = true }
craft = { workspace = true, features = ["ui-app"] }
# Screen-reader support (AGENTS.md rule 21): eframe hands the egui tree to the OS through AccessKit.
eframe = { workspace = true, features = ["accesskit"] }
